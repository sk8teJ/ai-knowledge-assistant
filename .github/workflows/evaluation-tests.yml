name: Evaluation unit tests

on:
  push:
    branches:
      - main
      - "improve/**"
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile evaluation code
        run: python -m compileall -q evaluation tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
